  function saveUi() {
    const rect = panel.getBoundingClientRect();
    storage.setItem("dg-chat-ui-v2", JSON.stringify({open:panel.classList.contains("dg-open"), light:host.classList.contains("dg-light"), model:modelSelect.value, detail:detailSelect.value, left:panel.style.left, top:panel.style.top, width:rect.width, height:rect.height}));
  }
  let saved = {};
  storage.removeItem("dg-chat-ui");
  try { saved = JSON.parse(storage.getItem("dg-chat-ui-v2") || "{}"); } catch (_) {}
  if (saved.detail === "detailed") detailSelect.value="detailed";
  if (saved.width && parentWindow.innerWidth > 700) {
    panel.style.width=Math.min(parentWindow.innerWidth-16,Math.max(340,saved.width))+"px";
    panel.style.height=Math.min(parentWindow.innerHeight-16,Math.max(430,saved.height))+"px";
  }
  if (saved.left && parentWindow.innerWidth > 700) {
    panel.style.left=saved.left; panel.style.top=saved.top; panel.style.right="auto"; panel.style.bottom="auto";
  }

  function clampPanel() {
    if (parentWindow.innerWidth <= 700) return;
    const rect=panel.getBoundingClientRect();
    const width=Math.min(rect.width,parentWindow.innerWidth-16);
    const height=Math.min(rect.height,parentWindow.innerHeight-16);
    panel.style.width=width+"px"; panel.style.height=height+"px";
    if (panel.style.left) {
      panel.style.left=Math.max(8,Math.min(parentWindow.innerWidth-width-8,rect.left))+"px";
      panel.style.top=Math.max(8,Math.min(parentWindow.innerHeight-height-8,rect.top))+"px";
    }
  }
  setTimeout(clampPanel,0);
  parentWindow.addEventListener("resize",clampPanel);

  function setOpen(open) {
    if (open) panel.classList.remove("dg-minimized");
    panel.classList.toggle("dg-open", open); overlay.classList.toggle("dg-open", open);
    overlay.setAttribute("aria-hidden", String(!open));
    if (open) setTimeout(() => { clampPanel(); input.focus(); }, 120);
    saveUi();
  }
  trigger.onclick = () => setOpen(!panel.classList.contains("dg-open"));
  overlay.onclick = (event) => { if (event.target === overlay) setOpen(false); };
  $(".dg-close").onclick = () => setOpen(false);
  $(".dg-minimize").onclick = () => { panel.classList.toggle("dg-minimized"); saveUi(); };

  let dragging = false, dx = 0, dy = 0;
  header.addEventListener("pointerdown", (event) => {
    if (parentWindow.innerWidth <= 700 || event.target.closest("button")) return;
    const rect = panel.getBoundingClientRect(); dragging=true; dx=event.clientX-rect.left; dy=event.clientY-rect.top;
    header.setPointerCapture(event.pointerId);
  });
  header.addEventListener("pointermove", (event) => {
    if (!dragging) return;
    const left=Math.max(8,Math.min(parentWindow.innerWidth-panel.offsetWidth-8,event.clientX-dx));
    const top=Math.max(8,Math.min(parentWindow.innerHeight-panel.offsetHeight-8,event.clientY-dy));
    panel.style.left=left+"px"; panel.style.top=top+"px"; panel.style.right="auto"; panel.style.bottom="auto";
  });
  header.addEventListener("pointerup", () => { dragging=false; saveUi(); });
  new parentWindow.ResizeObserver(() => { if (panel.classList.contains("dg-open") && !dragging) saveUi(); }).observe(panel);

  const escapeHtml = (value) => String(value).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  function highlight(code, language) {
    let safe = escapeHtml(code);
    if ((language || "").toLowerCase() === "cypher") {
      safe = safe.replace(/\b(MATCH|OPTIONAL|WHERE|RETURN|CREATE|MERGE|DELETE|DETACH|SET|REMOVE|WITH|UNWIND|ORDER BY|LIMIT|SKIP|AS|AND|OR|NOT|IN|CONTAINS|STARTS WITH|ENDS WITH)\b/gi, '<span class="dg-kw">$1</span>');
      safe = safe.replace(/(&quot;.*?&quot;|&#39;.*?&#39;)/g, '<span class="dg-str">$1</span>').replace(/\b(\d+(?:\.\d+)?)\b/g,'<span class="dg-num">$1</span>');
    }
    return safe;
  }
  function formatInline(value) {
    const fragments=[];
    const keep=(html) => { const token=`@@DGINLINE${fragments.length}@@`; fragments.push(html); return token; };
    let source=String(value);
    source=source.replace(/`([^`\n]+)`/g,(_,code)=>keep(`<code>${escapeHtml(code)}</code>`));
    source=source.replace(/\[([^\]\n]+)\]\(([^)\s]+)\)/g,(match,label,url)=>{
      try {
        const parsed=new URL(url,parentWindow.location.href);
        if (!['http:','https:','mailto:'].includes(parsed.protocol)) return match;
        return keep(`<a href="${escapeHtml(parsed.href)}" target="_blank" rel="noopener noreferrer">${escapeHtml(label)}</a>`);
      } catch (_) { return match; }
    });
    source=escapeHtml(source)
      .replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>')
      .replace(/__([^_\n]+)__/g,'<strong>$1</strong>')
      .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>')
      .replace(/~~([^~\n]+)~~/g,'<del>$1</del>');
    fragments.forEach((html,index)=>{ source=source.split(`@@DGINLINE${index}@@`).join(html); });
    return source;
  }
  function formatMarkdown(text) {
    const codeBlocks=[];
    const source=String(text).replace(/\r\n?/g,"\n").replace(/```([\w-]*)\n?([\s\S]*?)```/g,(_,lang,code)=>{
      const token=`@@DGCODE${codeBlocks.length}@@`;
      codeBlocks.push(`<div class="dg-code"><div class="dg-code-head"><span>${escapeHtml(lang || "代码")}</span><button class="dg-code-copy">复制代码</button></div><pre><code>${highlight(code.replace(/\n$/, ""),lang)}</code></pre></div>`);
      return `\n${token}\n`;
    });
    const html=[]; let paragraph=[]; let listTag="";
    const flushParagraph=()=>{ if(paragraph.length){ html.push(`<p>${paragraph.join("<br>")}</p>`); paragraph=[]; } };
    const closeList=()=>{ if(listTag){ html.push(`</${listTag}>`); listTag=""; } };
    const lines=source.split("\n");
    const tableSeparator=/^\s*\|?\s*:?-{3,}:?\s*(?:\|\s*:?-{3,}:?\s*)+\|?\s*$/;
    const tableCells=(value)=>value.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(item=>item.trim());
    for(let lineIndex=0;lineIndex<lines.length;lineIndex++){
      const rawLine=lines[lineIndex];
      const line=rawLine.trimEnd();
      if(line.includes("|") && lineIndex+1<lines.length && tableSeparator.test(lines[lineIndex+1])){
        flushParagraph(); closeList();
        const headers=tableCells(line); const rows=[]; lineIndex+=2;
        while(lineIndex<lines.length && lines[lineIndex].includes("|") && lines[lineIndex].trim()){
          rows.push(tableCells(lines[lineIndex])); lineIndex++;
        }
        lineIndex--;
        const head=headers.map(item=>`<th>${formatInline(item)}</th>`).join("");
        const body=rows.map(row=>`<tr>${row.map(item=>`<td>${formatInline(item)}</td>`).join("")}</tr>`).join("");
        html.push(`<div class="dg-table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`);
        continue;
      }
      const codeMatch=line.trim().match(/^@@DGCODE(\d+)@@$/);
      if(codeMatch){ flushParagraph(); closeList(); html.push(codeBlocks[Number(codeMatch[1])] || ""); continue; }
      if(!line.trim()){ flushParagraph(); closeList(); continue; }
      const heading=line.match(/^(#{1,3})\s+(.+)$/);
      if(heading){ flushParagraph(); closeList(); const level=heading[1].length; html.push(`<h${level}>${formatInline(heading[2])}</h${level}>`); continue; }
      if(/^\s*(?:---+|___+|\*\*\*+)\s*$/.test(line)){ flushParagraph(); closeList(); html.push("<hr>"); continue; }
      const quote=line.match(/^\s*>\s?(.*)$/);
      if(quote){ flushParagraph(); closeList(); html.push(`<blockquote>${formatInline(quote[1])}</blockquote>`); continue; }
      const unordered=line.match(/^\s*[-+*]\s+(.+)$/);
      const ordered=line.match(/^\s*\d+[.)]\s+(.+)$/);
      if(unordered || ordered){
        flushParagraph(); const nextTag=unordered ? "ul" : "ol";
        if(listTag!==nextTag){ closeList(); listTag=nextTag; html.push(`<${listTag}>`); }
        html.push(`<li>${formatInline((unordered || ordered)[1])}</li>`); continue;
      }
      closeList(); paragraph.push(formatInline(line));
    }
    flushParagraph(); closeList();
    return html.join("") || "<p></p>";
  }
  function bindCopies(scope) {
    scope.querySelectorAll(".dg-code-copy").forEach(button => button.onclick = async () => { await parentWindow.navigator.clipboard.writeText(button.closest(".dg-code").querySelector("code").textContent); button.textContent="已复制"; setTimeout(()=>button.textContent="复制代码",1100); });
  }
  function timeLabel(value) { try { return value ? new Date(value).toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"}) : "刚刚"; } catch (_) { return ""; } }
  function makeMessage(role, text, options={}) {
    const row=doc.createElement("div"); row.className=`dg-row ${role}`;
    const avatar=role === "assistant" ? '<div class="dg-mini-avatar">AI</div>' : '';
    row.innerHTML=`${avatar}<div class="dg-message-wrap"><div class="dg-bubble"></div><div class="dg-meta"><span>${timeLabel(options.timestamp)}</span>${role === "assistant" ? '<button class="dg-copy-message">复制</button>' : ''}</div></div>`;
    const bubble=row.querySelector(".dg-bubble");
    if (options.loading) bubble.innerHTML='<span class="dg-typing"><i></i><i></i><i></i></span>';
    else { bubble.innerHTML=formatMarkdown(text); bindCopies(bubble); }
    const copy=row.querySelector(".dg-copy-message");
    if (copy) copy.onclick=async()=>{ await parentWindow.navigator.clipboard.writeText(text); copy.textContent="已复制"; setTimeout(()=>copy.textContent="复制",1100); };
    list.appendChild(row); return {row,bubble};
  }
  function addNotice(text) { const node=doc.createElement("div"); node.className="dg-notice"; node.textContent=text; list.appendChild(node); }
  function renderTrace(row,payload) {
    const labels={get_visual_evidence:"读取多模态证据",get_triage_result:"读取本地分级",search_guideline:"检索本地指南",get_care_pathway:"读取照护路径",get_privacy_report:"读取隐私报告"};
    const details=doc.createElement("details"); details.className="dg-trace";
    const calls=Array.isArray(payload.tool_calls) ? payload.tool_calls : [];
    const items=calls.map(item=>`<div class="dg-trace-item"><span>${escapeHtml(labels[item.tool_name] || item.tool_name)}</span><span class="${item.status === 'success' ? 'dg-trace-ok' : 'dg-trace-bad'}">${item.status === 'success' ? '✓' : '异常'} ${Math.round(item.latency_ms || 0)} 毫秒</span></div>`).join("");
    const privacy=payload.privacy_status === "SAFE" ? '<span class="dg-trace-ok">✓ 安全</span>' : '<span class="dg-trace-bad">已阻止</span>';
    const steps=Array.isArray(payload.agent_trace) ? payload.agent_trace : [];
    const stepItems=steps.map(step=>{
      const missing=(step.missing_information || []).length ? `<div>信息缺口：${(step.missing_information || []).map(escapeHtml).join("、")}</div>` : "";
      const observations=(step.observation_summary || []).length ? `<div>观察摘要：${(step.observation_summary || []).map(escapeHtml).join("；")}</div>` : "";
      const query=step.retrieval_query ? `<div>检索语句：${escapeHtml(step.retrieval_query)}</div>` : "";
      return `<div class="dg-trace-step"><strong>步骤 ${step.step} · ${escapeHtml(step.intent || "检索决策")}</strong><div>决策：${escapeHtml(step.decision || "")}</div>${query}${missing}${observations}</div>`;
    }).join("");
    details.innerHTML=`<summary>Agent Trace · ${steps.length} 步 / ${calls.length} 个工具</summary><div class="dg-trace-body">${stepItems}${items}<div class="dg-trace-item"><span>隐私出境检查</span>${privacy}</div><div class="dg-trace-item"><span>解释模型</span><span>${escapeHtml(payload.model || payload.provider || "未知")}</span></div></div>`;
    row.querySelector(".dg-message-wrap").insertBefore(details,row.querySelector(".dg-meta"));
  }
  function renderHistory() {
    list.innerHTML="";
    if (!allHistory.length) {
      list.innerHTML=`<div class="dg-empty"><div class="dg-empty-icon">✦</div><strong>你好，我是智能分诊助手</strong><p>${cfg.caseId ? "可以询问筛查依据、下一步安排或隐私保护情况。" : "请先在主页面上传图片并完成本地分析。"}</p></div>`;
    } else allHistory.slice(shownFrom).forEach(item => makeMessage(item.role === "user" ? "user" : "assistant", item.message || item.content || "", {timestamp:item.timestamp}));
    moreButton.style.display=shownFrom>0 ? "block" : "none"; messages.scrollTop=messages.scrollHeight;
  }
  moreButton.onclick=()=>{ const oldHeight=messages.scrollHeight; shownFrom=Math.max(0,shownFrom-20); renderHistory(); messages.scrollTop=messages.scrollHeight-oldHeight; };

  async function loadModels() {
    try {
      const response=await fetch(`${cfg.apiUrl}/v1/chat/models`,{headers:authHeaders}); if (!response.ok) throw new Error("模型列表读取失败");
      const models=await response.json(); modelSelect.innerHTML="";
      models.forEach(model=>{ const option=doc.createElement("option"); option.value=model.id; option.textContent=`${model.label}${model.available ? "" : ` · ${model.status}`}`; option.disabled=!model.available; modelSelect.appendChild(option); });
      const preferred=saved.model || cfg.defaultModel; const target=[...modelSelect.options].find(option=>option.value===preferred && !option.disabled) || [...modelSelect.options].find(option=>!option.disabled);
      if (target) modelSelect.value=target.value; else { modelSelect.innerHTML='<option>暂无可用模型</option>'; send.disabled=true; }
      statusText.textContent=target ? `${target.textContent} 已连接` : "暂无可用云模型";
    } catch (error) { modelSelect.innerHTML='<option>模型状态读取失败</option>'; statusText.textContent="后端连接异常"; }
  }
  modelSelect.onchange=()=>{ statusText.textContent=`${modelSelect.options[modelSelect.selectedIndex].textContent} 已选择`; addNotice("已切换模型，当前对话上下文继续保留"); saveUi(); messages.scrollTop=messages.scrollHeight; };
  detailSelect.onchange=()=>{ addNotice(detailSelect.value === "detailed" ? "已切换为详细归因模式" : "已切换为简明回答模式"); saveUi(); messages.scrollTop=messages.scrollHeight; };

  async function loadHistory() {
    if (!cfg.caseId) { renderHistory(); return; }
    try { const response=await fetch(`${cfg.apiUrl}/v1/cases/${encodeURIComponent(cfg.caseId)}/chat-history`,{headers:authHeaders}); if (!response.ok) throw new Error(); allHistory=await response.json(); shownFrom=Math.max(0,allHistory.length-20); renderHistory(); }
    catch (_) { renderHistory(); addNotice("历史对话暂时无法读取"); }
  }
  $(".dg-clear").onclick=async()=>{
    if (!cfg.caseId || !parentWindow.confirm("确认清空当前病例的对话历史吗？")) return;
    try { const response=await fetch(`${cfg.apiUrl}/v1/cases/${encodeURIComponent(cfg.caseId)}/chat-history`,{method:"DELETE",headers:authHeaders}); if(!response.ok) throw new Error(); allHistory=[]; shownFrom=0; storage.removeItem(storageKey); renderHistory(); }
    catch (_) { addNotice("清空失败，请检查后端连接"); }
  };

  async function typeAnswer(bubble,text) {
    bubble.textContent="";
    for (let index=0; index<text.length; index++) { bubble.textContent+=text[index]; messages.scrollTop=messages.scrollHeight; await new Promise(resolve=>setTimeout(resolve,"。！？；\n".includes(text[index]) ? 55 : 13)); }
    bubble.innerHTML=formatMarkdown(text); bindCopies(bubble);
  }
  async function submit() {
    const text=input.value.trim(); if (!text || busy) return;
    if (!cfg.caseId) { addNotice("请先在主页面完成图片分析，再开始对话"); messages.scrollTop=messages.scrollHeight; return; }
    busy=true; send.disabled=true; input.value=""; input.style.height="auto";
    if (list.querySelector(".dg-empty")) list.innerHTML="";
    makeMessage("user",text); const pending=makeMessage("assistant","",{loading:true}); messages.scrollTop=messages.scrollHeight;
    statusText.textContent="正在调用本地工具与模型…";
    try {
      const response=await fetch(`${cfg.apiUrl}/v1/chat`,{method:"POST",headers:{"Content-Type":"application/json",...authHeaders},body:JSON.stringify({case_id:cfg.caseId,message:text,mode:cfg.mode,model:modelSelect.value,detail_level:detailSelect.value})});
      let payload={}; try { payload=await response.json(); } catch (_) {}
      if (!response.ok) throw new Error(payload.detail || `请求失败（${response.status}）`);
      const meta=pending.row.querySelector(".dg-meta"); meta.innerHTML=`<span>${payload.model || modelSelect.value}</span><button class="dg-copy-message">复制</button>`;
      const copy=meta.querySelector("button"); copy.onclick=async()=>{await parentWindow.navigator.clipboard.writeText(payload.response);copy.textContent="已复制";setTimeout(()=>copy.textContent="复制",1100);};
      await typeAnswer(pending.bubble,payload.response);
      renderTrace(pending.row,payload);
      statusText.textContent=`${payload.model || modelSelect.value} · 已完成`;
    } catch (error) {
      pending.row.remove(); const node=doc.createElement("div"); node.className="dg-error"; node.textContent=`调用失败：${error.message || "网络异常"}`; list.appendChild(node); statusText.textContent="请求失败，请重试";
    } finally { busy=false; send.disabled=false; input.focus(); messages.scrollTop=messages.scrollHeight; }
  }
  send.onclick=submit;
  input.addEventListener("input",()=>{ input.style.height="auto"; input.style.height=Math.min(input.scrollHeight,98)+"px"; });
  input.addEventListener("keydown",event=>{ if(event.key==="Enter"&&!event.shiftKey){event.preventDefault();submit();} });

  Promise.all([loadModels(),loadHistory()]).then(()=>{ if(saved.open) setOpen(true); });
})();
</script>
